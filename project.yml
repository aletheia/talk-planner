name: TalkPlanner
options:
  bundleIdPrefix: com.lucabianchi
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  TalkPlanner:
    type: application
    platform: iOS
    sources:
      - path: TalkPlanner
      - path: Shared
    info:
      path: TalkPlanner/Info.plist
      properties:
        CFBundleDisplayName: Talk Planner
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: TalkPlanner/TalkPlanner.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lucabianchi.TalkPlanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucabianchi.TalkPlanner
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
    dependencies:
      - target: TalkPlannerWidgets
      - target: TalkPlannerWatch
  TalkPlannerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TalkPlannerWidgets
      - path: Shared/Models.swift
      - path: Shared/TalkSession.swift
      - path: Shared/TimeFormat.swift
      - path: Shared/WidgetSessionState.swift
    info:
      path: TalkPlannerWidgets/Info.plist
      properties:
        CFBundleDisplayName: Talk Planner
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TalkPlannerWidgets/TalkPlannerWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lucabianchi.TalkPlanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucabianchi.TalkPlanner.Widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
  TalkPlannerWatch:
    type: application
    platform: watchOS
    sources:
      - path: TalkPlannerWatch
      - path: Shared
    info:
      path: TalkPlannerWatch/Info.plist
      properties:
        CFBundleDisplayName: Talk Planner
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.lucabianchi.TalkPlanner
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucabianchi.TalkPlanner.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
